<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>全能綜合情報解析 (手機號 phone.dat + 18位身份證驗證)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        .glow-box { box-shadow: 0 0 35px rgba(56, 189, 248, 0.15); }
        .tab-active { border-bottom: 2px solid #38bdf8; color: #38bdf8; font-weight: bold; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="w-full max-w-xl bg-slate-900 border border-slate-800 rounded-2xl p-6 md:p-8 glow-box relative overflow-hidden my-8">
        
        <!-- Tab 切換標籤 -->
        <div class="flex border-b border-slate-800 mb-6 text-center text-sm text-slate-400">
            <button id="tabIdBtn" onclick="switchTab('id')" class="flex-1 pb-3 tab-active">🪪 身份證號解析</button>
            <button id="tabPhoneBtn" onclick="switchTab('phone')" class="flex-1 pb-3">📱 手機號歸屬地 (DAT)</button>
        </div>

        <!-- ==================== 1. 身份證解析區塊 ==================== -->
        <div id="idSection">
            <div class="text-center mb-6">
                <h1 class="text-xl font-bold text-white tracking-wide">二代居民身份證情報解析</h1>
                <p class="text-xs text-slate-400 mt-1">精準解析地址碼、生日、年齡、星座、性別與 ISO 7064 校驗碼</p>
            </div>

            <div class="space-y-4">
                <input type="text" id="idInput" maxlength="18" placeholder="請輸入 18 位身份證號碼"
                    class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-base focus:outline-none focus:border-blue-500 transition-colors text-center tracking-wider font-mono">
                <button onclick="parseIDCard()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl transition-all shadow-lg shadow-blue-600/30">
                    🔍 立即驗證並解析身份證
                </button>
            </div>

            <div id="idError" class="hidden mt-4 text-center text-red-400 text-sm bg-red-500/10 py-2 rounded-lg border border-red-500/20"></div>

            <div id="idResult" class="hidden mt-6 pt-6 border-t border-slate-800 space-y-4">
                <!-- 校驗碼狀態 -->
                <div id="idCheckStatus" class="p-3 rounded-xl text-center font-bold text-sm">--</div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">戶籍歸屬地區 (前2位)</span>
                        <span id="resIdArea" class="text-blue-400 font-bold text-sm">--</span>
                    </div>
                    <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">性別</span>
                        <span id="resIdGender" class="text-emerald-400 font-bold text-base">--</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2">
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50 text-center">
                        <span class="text-slate-400 text-xs block mb-1">出生日期</span>
                        <span id="resIdBirth" class="text-purple-400 font-mono text-xs font-bold">--</span>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50 text-center">
                        <span class="text-slate-400 text-xs block mb-1">實歲年齡</span>
                        <span id="resIdAge" class="text-amber-400 font-mono text-xs font-bold">--</span>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50 text-center">
                        <span class="text-slate-400 text-xs block mb-1">星座分析</span>
                        <span id="resIdAstro" class="text-cyan-400 text-xs font-bold">--</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 2. 手機號解析區塊 ==================== -->
        <div id="phoneSection" class="hidden">
            <div class="mb-4 p-3 bg-slate-800/80 rounded-xl border border-slate-700 text-center">
                <input type="file" id="datFileInput" accept=".dat" onchange="loadDatFile(event)"
                    class="block w-full text-xs text-slate-400 file:mr-4 file:py-1.5 file:px-3 file:rounded-lg file:border-0 file:text-xs file:bg-blue-600 file:text-white hover:file:bg-blue-500 cursor-pointer">
                <p id="dbStatus" class="text-xs text-amber-400 mt-2">提示：請上傳 phone.dat 號段數據庫</p>
            </div>

            <div class="space-y-4">
                <input type="tel" id="phoneInput" maxlength="11" placeholder="請輸入 11 位手機號碼"
                    class="w-full bg-slate-800 border border-slate-700 text-white placeholder-slate-500 rounded-xl px-4 py-3 text-lg text-center font-mono">
                <button onclick="searchPhone()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 rounded-xl shadow-lg">
                    🔍 查詢手機號屬性
                </button>
            </div>

            <div id="phoneError" class="hidden mt-4 text-center text-red-400 text-sm bg-red-500/10 py-2 rounded-lg border border-red-500/20"></div>
            
            <div id="phoneResult" class="hidden mt-6 pt-4 border-t border-slate-800 text-sm space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">營運商</span>
                        <span id="resOperator" class="text-emerald-400 font-bold">--</span>
                    </div>
                    <div class="bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">歸屬地</span>
                        <span id="resLocation" class="text-blue-400 font-bold">--</span>
                    </div>
                </div>

                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">電話區號</span>
                        <span id="resAreaCode" class="text-purple-400 font-mono font-bold text-xs">--</span>
                    </div>
                    <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">郵遞區號</span>
                        <span id="resZipCode" class="text-amber-400 font-mono font-bold text-xs">--</span>
                    </div>
                    <div class="bg-slate-800/60 p-2 rounded-lg border border-slate-700/50">
                        <span class="text-slate-400 text-xs block mb-1">行政區劃碼</span>
                        <span id="resAdminCode" class="text-cyan-400 font-mono font-bold text-xs">--</span>
                    </div>
                </div>
            </div>
        </div>

    </div>

    <script>
        // Tab 切換邏輯
        function switchTab(type) {
            if (type === 'id') {
                document.getElementById('idSection').classList.remove('hidden');
                document.getElementById('phoneSection').classList.add('hidden');
                document.getElementById('tabIdBtn').className = "flex-1 pb-3 tab-active";
                document.getElementById('tabPhoneBtn').className = "flex-1 pb-3 text-slate-400";
            } else {
                document.getElementById('idSection').classList.add('hidden');
                document.getElementById('phoneSection').classList.remove('hidden');
                document.getElementById('tabIdBtn').className = "flex-1 pb-3 text-slate-400";
                document.getElementById('tabPhoneBtn').className = "flex-1 pb-3 tab-active";
            }
        }

        // ==================== 1. 身份證 ISO 7064 MOD 11-2 演算法 ====================
        const AREA_CODES = {
            '11': '北京市', '12': '天津市', '13': '河北省', '14': '山西省', '15': '内蒙古自治区',
            '21': '辽宁省', '22': '吉林省', '23': '黑龙江省',
            '31': '上海市', '32': '江苏省', '33': '浙江省', '34': '安徽省', '35': '福建省', '36': '江西省', '37': '山东省',
            '41': '河南省', '42': '湖北省', '43': '湖南省', '44': '广东省', '45': '广西壮族自治区', '46': '海南省',
            '50': '重庆市', '51': '四川省', '52': '贵州省', '53': '云南省', '54': '西藏自治区',
            '61': '陕西省', '62': '甘肃省', '63': '青海省', '64': '宁夏回族自治区', '65': '新疆维吾尔自治区',
            '71': '台湾省', '81': '香港特别行政区', '82': '澳门特别行政区'
        };

        function checkIDValidation(idStr) {
            const weights = [7, 9, 10, 5, 8, 4, 2, 1, 6, 3, 7, 9, 10, 5, 8, 4, 2];
            const checkMap = ['1', '0', 'X', '9', '8', '7', '6', '5', '4', '3', '2'];
            
            let sum = 0;
            for (let i = 0; i < 17; i++) {
                sum += parseInt(idStr[i], 10) * weights[i];
            }
            const mod = sum % 11;
            const expectedCheckDigit = checkMap[mod];
            const actualCheckDigit = idStr[17].toUpperCase();

            return {
                isValid: expectedCheckDigit === actualCheckDigit,
                expected: expectedCheckDigit
            };
        }

        function getAstro(month, day) {
            const dates = [20, 19, 21, 20, 21, 22, 23, 23, 23, 24, 23, 22];
            const astros = ["摩羯座", "水瓶座", "双鱼座", "白羊座", "金牛座", "双子座", "巨蟹座", "狮子座", "处女座", "天秤座", "天蝎座", "射手座", "摩羯座"];
            return day < dates[month - 1] ? astros[month - 1] : astros[month];
        }

        function parseIDCard() {
            const idStr = document.getElementById('idInput').value.trim().toUpperCase();
            const errorMsg = document.getElementById('idError');
            const resultBox = document.getElementById('idResult');

            errorMsg.classList.add('hidden');

            const reg = /^[1-9]\d{5}(18|19|20)\d{2}(0[1-9]|1[0-2])(0[1-9]|[12]\d|3[01])\d{3}[\dX]$/;
            if (!reg.test(idStr)) {
                errorMsg.innerText = '請輸入正確的 18 位居民身份證號碼格式！';
                errorMsg.classList.remove('hidden');
                resultBox.classList.add('hidden');
                return;
            }

            const checkRes = checkIDValidation(idStr);
            const statusBox = document.getElementById('idCheckStatus');

            if (checkRes.isValid) {
                statusBox.innerText = '✅ 身份證 ISO 7064 校驗碼驗證合格';
                statusBox.className = 'p-3 rounded-xl text-center font-bold text-xs bg-emerald-500/10 text-emerald-400 border border-emerald-500/20';
            } else {
                statusBox.innerText = `❌ 校驗碼錯誤！末位應為 ${checkRes.expected}（疑似輸錯或無效）`;
                statusBox.className = 'p-3 rounded-xl text-center font-bold text-xs bg-red-500/10 text-red-400 border border-red-500/20';
            }

            const provCode = idStr.substring(0, 2);
            const provinceName = AREA_CODES[provCode] || '未知行政區';

            const year = parseInt(idStr.substring(6, 10), 10);
            const month = parseInt(idStr.substring(10, 12), 10);
            const day = parseInt(idStr.substring(12, 14), 10);

            const birthDate = new Date(year, month - 1, day);
            const today = new Date();
            let age = today.getFullYear() - year;
            if (today.getMonth() < (month - 1) || (today.getMonth() === (month - 1) && today.getDate() < day)) {
                age--;
            }

            const genderOrder = parseInt(idStr.substring(16, 17), 10);
            const gender = (genderOrder % 2 === 1) ? '男性 ♂' : '女性 ♀';
            const astro = getAstro(month, day);

            document.getElementById('resIdArea').innerText = provinceName;
            document.getElementById('resIdGender').innerText = gender;
            document.getElementById('resIdBirth').innerText = `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
            document.getElementById('resIdAge').innerText = `${age} 歲`;
            document.getElementById('resIdAstro').innerText = astro;

            resultBox.classList.remove('hidden');
        }

        // ==================== 2. DAT 手機號離線檢索部分 ====================
        let datBuffer = null, firstIndexOffset = 0, totalRecords = 0;

        function loadDatFile(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(evt) {
                datBuffer = new DataView(evt.target.result);
                firstIndexOffset = datBuffer.getInt32(4, true);
                totalRecords = Math.floor((evt.target.result.byteLength - firstIndexOffset) / 9);
                document.getElementById('dbStatus').innerText = `✅ DAT 已載入 ${totalRecords} 條號段數據`;
                document.getElementById('dbStatus').className = "text-xs text-emerald-400 mt-2 font-bold";
            };
            reader.readAsArrayBuffer(file);
        }

        function searchPhone() {
            const phone = document.getElementById('phoneInput').value.trim();
            const errorMsg = document.getElementById('phoneError');
            const resultBox = document.getElementById('phoneResult');

            errorMsg.classList.add('hidden');

            if (!datBuffer) {
                errorMsg.innerText = '請先上傳 phone.dat 數據庫檔案！';
                errorMsg.classList.remove('hidden');
                resultBox.classList.add('hidden');
                return;
            }

            if (phone.length < 7 || !/^\d+$/.test(phone)) {
                errorMsg.innerText = '請輸入至少前 7 位的數字手機號碼！';
                errorMsg.classList.remove('hidden');
                resultBox.classList.add('hidden');
                return;
            }

            const target = parseInt(phone.substring(0, 7), 10);
            let left = 0, right = totalRecords - 1;
            let found = false;

            while (left <= right) {
                const mid = Math.floor((left + right) / 2);
                const offset = firstIndexOffset + mid * 9;
                const cur = datBuffer.getInt32(offset, true);

                if (cur === target) {
                    found = true;
                    const detailOffset = datBuffer.getInt32(offset + 4, true);
                    let bytes = [], curr = detailOffset;
                    
                    while (datBuffer.getUint8(curr) !== 0) { 
                        bytes.push(datBuffer.getUint8(curr)); 
                        curr++; 
                    }

                    const rawStr = new TextDecoder('utf-8').decode(new Uint8Array(bytes));
                    const arr = rawStr.split('|');

                    const vendorIndex = datBuffer.getUint8(offset + 8);
                    const vendors = ["未知", "中国移动", "中国联通", "中国电信", "中国广电"];

                    document.getElementById('resOperator').innerText = vendors[vendorIndex] || "其他營運商";
                    document.getElementById('resLocation').innerText = `${arr[0] || ''} ${arr[1] || ''}`.trim() || '無數據';
                    document.getElementById('resZipCode').innerText = arr[2] || '無數據';
                    document.getElementById('resAreaCode').innerText = arr[3] || '無數據';
                    document.getElementById('resAdminCode').innerText = arr[4] || '無數據';

                    resultBox.classList.remove('hidden');
                    return;
                }
                if (cur < target) left = mid + 1; else right = mid - 1;
            }

            if (!found) {
                errorMsg.innerText = '未在 DAT 數據庫中查到該號段資訊！';
                errorMsg.classList.remove('hidden');
                resultBox.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
